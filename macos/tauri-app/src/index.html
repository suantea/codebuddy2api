<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>WorkBuddy2API</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e6e8ec;
    }
    .card {
      text-align: center;
      padding: 32px 40px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #5ca8ff, #3a78d6);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 700; color: #fff;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    p { font-size: 13px; color: #9aa3b2; }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #5ca8ff; margin: 14px auto 0;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.8);} 50% { opacity: 1; transform: scale(1);} }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">W↗</div>
    <h1>WorkBuddy2API</h1>
    <p>正在连接本地服务…</p>
    <div class="dot"></div>
  </div>
  <script>
    // 服务就绪后自动跳转到管理后台
    async function poll() {
      try {
        const r = await fetch("http://127.0.0.1:8787/health");
        if (r.ok) { location.href = "http://127.0.0.1:8787/admin/"; return; }
      } catch (e) {}
      setTimeout(poll, 500);
    }
    poll();
  </script>
</body>
</html>
